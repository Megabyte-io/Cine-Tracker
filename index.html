<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="leftHead">
          <img class="logo" src="./assests/movie.png">
          <h1 class="logoName">Cine Tracker</h1>
        </div>
        <div class="middleHead">
            <div class="section" id="home">Home</div>
            <div class="section" id="upcoming">Upcoming</div>
            <div class="section" id="popular">Popular</div>
        </div>
        <div class="rightHead">
          <input class="search" type="text" placeholder="Search Movies🎬">
          <button class="searchBtn">Search</button>   
        </div>
    </header>
    <div class="con">
      <section class="hero">

      <div class="heroOverlay">

        <span class="tag">🔥 Trending Now</span>

        <h1 id="heroTitle">
            Loading...
        </h1>

        <div>
            <span class="rating"></span>
            <span class="movieInfo" id="movieInfoYear"></span>
            <span class="movieInfo" id="movieInfoGenre"></span>
            <span class="movieInfo" id="movieInfoType"></span>
        </div>

        <p id="heroOverview"></p>
        
        </div>

      </div>

      </section>
    <div class="container">
     
    </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
